[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -ra --strict-markers

markers =
    integration: Gerçek dosya sistemi, PDF/DOCX okuyucuları veya birden fazla modülü birlikte test eder.
    llm_eval: Gerçek LLM çağrısı yapan ve varsayılan test suite dışında ayrı çalıştırılan kalite değerlendirmeleri.
    slow: Çalışması uzun sürebilen test veya değerlendirmeler.